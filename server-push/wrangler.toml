name = "claudio-push"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Serve at https://claudio-push.<account>.workers.dev (the URL the app connects to).
# Preview URLs aren't needed for this single-purpose worker.
workers_dev = true
preview_urls = false

# Cron runs every 5 minutes (288/day) to stay comfortably inside the Cloudflare
# free tier — a per-minute cron exceeds the free KV "list" quota (1,000/day).
# Reminders fire within ~5 min of their time (the worker's catch window covers
# the gap); set a lead time in the app if you want them earlier.
[triggers]
crons = ["*/5 * * * *"]

# KV store of { subscription, reminders }. Create with:
#   npx wrangler kv namespace create SUBS
# then paste the printed id below.
[[kv_namespaces]]
binding = "SUBS"
id = "9867c65893864a33ac11ad7697c076b4"

[vars]
# Public VAPID key (safe to expose) + a contact mailto. The PRIVATE key is set as
# a secret, not here:  npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = "BFgkyeP8IJPCsRf9k8DSU2ywt-eCSQfHZzbtQx_gMsBN4g-STs34Mf1khgVhnnMJZbNwSoiyQ0Ilk85wJd9Rw4Q"
VAPID_SUBJECT = "mailto:dcasares.silva@gmail.com"
